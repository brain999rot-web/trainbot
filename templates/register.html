{% extends "base.html" %}

{% block title %}Реєстрація - TrainBot{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Реєстрація</h1>
        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="user_id">ID користувача (Telegram ID) *</label>
                <input type="text" id="user_id" name="user_id" required class="form-control" placeholder="123456789">
                <small class="form-text">Ваш ID з Telegram. Можна отримати у боті @userinfobot</small>
            </div>

            <div class="form-group">
                <label for="username">Ім'я користувача</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Іван">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">Вік</label>
                    <input type="number" id="age" name="age" class="form-control" min="10" max="100" placeholder="25">
                </div>
                <div class="form-group">
                    <label for="gender">Стать</label>
                    <select id="gender" name="gender" class="form-control">
                        <option value="">Оберіть</option>
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="height">Зріст (см)</label>
                    <input type="number" id="height" name="height" class="form-control" min="100" max="250" step="0.1" placeholder="175">
                </div>
                <div class="form-group">
                    <label for="weight">Вага (кг)</label>
                    <input type="number" id="weight" name="weight" class="form-control" min="30" max="300" step="0.1" placeholder="75">
                </div>
            </div>

            <div class="form-group">
                <label for="experience">Досвід тренувань</label>
                <select id="experience" name="experience" class="form-control">
                    <option value="">Оберіть</option>
                    <option value="beginner">Початківець (0-6 місяців)</option>
                    <option value="intermediate">Середній (6 місяців - 2 роки)</option>
                    <option value="advanced">Досвідчений (2+ роки)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="workouts_per_week">Тренувань на тиждень</label>
                <select id="workouts_per_week" name="workouts_per_week" class="form-control">
                    <option value="">Оберіть</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                </select>
            </div>

            <div class="form-group">
                <label for="goal">Мета тренувань</label>
                <select id="goal" name="goal" class="form-control">
                    <option value="">Оберіть</option>
                    <option value="strength">Сила</option>
                    <option value="hypertrophy">М'язова маса</option>
                    <option value="endurance">Витривалість</option>
                    <option value="weight_loss">Схуднення</option>
                    <option value="general_fitness">Загальна фітнес</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Зареєструватись</button>
        </form>

        <div class="auth-footer">
            <p>Вже є акаунт? <a href="{{ url_for('login') }}">Увійти</a></p>
        </div>
    </div>
</div>
{% endblock %}
