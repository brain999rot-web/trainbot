{% extends "base.html" %}

{% block title %}Редагування профілю - TrainBot{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Редагування профілю</h1>

    <form method="POST" action="{{ url_for('edit_profile') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="username">Ім'я користувача</label>
            <input type="text" id="username" name="username" class="form-control" value="{{ user.username or '' }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="age">Вік</label>
                <input type="number" id="age" name="age" class="form-control" min="10" max="100" value="{{ user.age or '' }}">
            </div>
            <div class="form-group">
                <label for="gender">Стать</label>
                <select id="gender" name="gender" class="form-control">
                    <option value="">Оберіть</option>
                    <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Чоловіча</option>
                    <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Жіноча</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="height">Зріст (см)</label>
                <input type="number" id="height" name="height" class="form-control" min="100" max="250" step="0.1" value="{{ user.height or '' }}">
            </div>
            <div class="form-group">
                <label for="weight">Вага (кг)</label>
                <input type="number" id="weight" name="weight" class="form-control" min="30" max="300" step="0.1" value="{{ user.weight or '' }}">
            </div>
        </div>

        <div class="form-group">
            <label for="experience">Досвід тренувань</label>
            <select id="experience" name="experience" class="form-control">
                <option value="">Оберіть</option>
                <option value="beginner" {% if user.experience == 'beginner' %}selected{% endif %}>Початківець (0-6 місяців)</option>
                <option value="intermediate" {% if user.experience == 'intermediate' %}selected{% endif %}>Середній (6 місяців - 2 роки)</option>
                <option value="advanced" {% if user.experience == 'advanced' %}selected{% endif %}>Досвідчений (2+ роки)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="workouts_per_week">Тренувань на тиждень</label>
            <select id="workouts_per_week" name="workouts_per_week" class="form-control">
                <option value="">Оберіть</option>
                {% for i in range(2, 7) %}
                <option value="{{ i }}" {% if user.workouts_per_week == i %}selected{% endif %}>{{ i }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="goal">Мета тренувань</label>
            <select id="goal" name="goal" class="form-control">
                <option value="">Оберіть</option>
                <option value="strength" {% if user.current_goal == 'strength' %}selected{% endif %}>Сила</option>
                <option value="hypertrophy" {% if user.current_goal == 'hypertrophy' %}selected{% endif %}>М'язова маса</option>
                <option value="endurance" {% if user.current_goal == 'endurance' %}selected{% endif %}>Витривалість</option>
                <option value="weight_loss" {% if user.current_goal == 'weight_loss' %}selected{% endif %}>Схуднення</option>
                <option value="general_fitness" {% if user.current_goal == 'general_fitness' %}selected{% endif %}>Загальна фітнес</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Зберегти зміни</button>
            <a href="{{ url_for('profile') }}" class="btn btn-secondary">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
